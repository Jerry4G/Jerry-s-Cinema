    .video-player { 
        position: relative; 
        width: 100%; 
        height: 600px; 
        background: #000; 
    }

    .start-overlay {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
    }

    .start-button {
        border: none;
        padding: 16px 30px;
        background: #ff6b35;
        color: white;
        font-size: 18px;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
    }

    .start-button:hover {
        background: #ff5722;
    }

    .video-player iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: none;
    }

    .watch-info { 
        padding: 30px; 
        color: #fff; 
    } 

    .back-button { 
        display: inline-block; 
        margin-bottom: 20px; 
        padding: 10px 20px; 
        background: #ff6b35; 
        color: white; 
        text-decoration: none; 
        border-radius: 5px; 
        transition: background 0.3s; 
    } 

    .back-button:hover { 
        background: #ff5722; 
    } 

    @media (max-width: 768px) { 
        .video-player { 
            height: 300px; 
        } 

        .watch-info { 
            padding: 20px; 
        } 
    } 
</style>

</head> 
<body class="watch-container"> 
    <!-- Navigation --> 
    <nav class="navbar"> 
        <div class="container"> 
            <div class="logo">🎬 Jerry's Cinema</div> 
            <a href="/" class="back-button">← Retour</a> 
        </div>

```
<!-- Lecteur vidéo Vidcore --> 
<div class="video-player" id="videoPlayer">

    <div class="start-overlay" id="startOverlay">
        <button class="start-button" id="startButton">
            ▶ Démarrer
        </button>
    </div>

    <iframe  
        src="https://vidcore.io/embed/movie/{{ movie_id }}" 
        width="100%" 
        height="100%" 
        frameborder="0" 
        allowfullscreen 
        allow="autoplay; encrypted-media; fullscreen" 
        style="border: none;"> 
    </iframe> 
</div> 

<!-- Infos du film --> 
<div class="watch-info"> 
    <a href="/" class="back-button">← Retour à l'accueil</a> 
    <h1>Film en cours de lecture</h1> 
    <p>Profitez de votre film!</p> 
</div> 

<footer class="footer"> 
    <div class="container"> 
        <p>&copy; 2026 MovieFlix. Powered by TMDB</p> 
    </div> 
</footer> 

<script>
    const startButton = document.getElementById('startButton');
    const startOverlay = document.getElementById('startOverlay');
    const videoPlayer = document.getElementById('videoPlayer');

    startButton.addEventListener('click', async function () {
        try {
            if (videoPlayer.requestFullscreen) {
                await videoPlayer.requestFullscreen();
            } else if (videoPlayer.webkitRequestFullscreen) {
                videoPlayer.webkitRequestFullscreen();
            }
        } catch (error) {
            console.log('Le plein écran n’a pas été autorisé.');
        }

        startOverlay.style.display = 'none';
    });
</script>
